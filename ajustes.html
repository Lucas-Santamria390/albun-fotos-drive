<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MiAlbumWeb: ajustes de tu álbum. Invita colaboradores y visitantes, gestiona permisos y revoca accesos.">
  <title>MiAlbumWeb — Ajustes</title>
  <script>try { document.documentElement.setAttribute("data-tema", localStorage.getItem("malbum-tema") || "claro"); } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='34' r='13' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='34' r='5.5' fill='white'/%3E%3Crect x='14' y='16' width='10' height='10' rx='3' fill='white' opacity='.9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="cargando" class="capa" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Cargando ajustes…</p>
  </div>

  <div id="capaAuth" class="capa centrar oculto">
    <section class="tarjeta login">
      <h2>Para entrar a los ajustes</h2>
      <p>Necesitas iniciar sesión con Google para administrar tu álbum.</p>
      <button id="btnLoginGoogle" class="btn btn-prim">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5a4 4 0 1 0 0 7" stroke-linecap="round"/></svg>
        Iniciar sesión con Google
      </button>
      <p id="msjCapa" class="mar-gen"></p>
    </section>
  </div>

  <div id="capaContenido" class="oculto">
    <header class="cabeza">
      <div class="cabeza-fila">
        <div class="brand">
          <span class="logo">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10.5" r="1.6"/><path d="M3 16l4.4-4.2a1.4 1.4 0 0 1 2 0L14 16"/><path d="M14.5 14.5l1.6-1.5a1.4 1.4 0 0 1 2 0L21 15.5"/></svg>
          </span>
          <h1>MiAlbumWeb<span class="tag">Ajustes</span></h1>
        </div>
        <div class="sesion">
          <div class="chip">
            <span class="avatar" id="avatar">?</span>
            <span id="txtSesion"></span>
          </div>                 
          <a id="btnVolver" class="btn btn-ghost" href="album.html">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Volver al álbum
          </a>
          <button id="btnTema" class="interruptor" role="switch" aria-checked="false" title="Cambiar tema" aria-label="Cambiar tema">
            <span class="interruptor-bola">
              <svg class="icono icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
              <svg class="icono icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </span>
          </button>   
          <button id="btnSalir" class="btn btn-sec">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Salir
          </button>
        </div>
      </div>
    </header>

    <main class="centro">
      <section id="panelAdmin" class="tarjeta panel-admin" aria-label="Administración">
        <h2>
          <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Ajustes
        </h2>
        <div class="estadisticas">
          <div class="stat"><b id="statUsuarios">0</b><span>usuarios</span></div>
          <div class="stat"><b id="statInv">0</b><span>invitaciones</span></div>
          <div class="stat"><b id="statFotos">0</b><span>fotos</span></div>
        </div>

        <h2>Usuarios</h2>
        <ul id="listaUsuarios" class="lista"></ul>

        <h2>Invitaciones</h2>
        <div class="fila-campos-2">
          <label class="campo">
            <span>Rol de invitación</span>
            <select id="selRol">
              <option value="colaborador">Colaborador</option>
              <option value="visitante">Visitante</option>
            </select>
          </label>
          <label class="campo">
            <span>Expiración (opcional)</span>
            <input type="date" id="inpExp">
          </label>
        </div>
        <div class="campo campo-checks">
          <span>Permisos</span>
          <label><input type="checkbox" id="chkSubir" checked> Subir</label>
          <label><input type="checkbox" id="chkBorrar"> Borrar</label>
          <label><input type="checkbox" id="chkModificar"> Modificar</label>
        </div>
        <button id="btnCrearInvitacion" class="btn btn-prim btn-crear">
          <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8zM12 11v6M9 14h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Generar invitación
        </button>

        <div id="salidaInvitacion" class="tarjeta-inv oculto">
          <input id="enlaceInv" readonly>
          <div class="fila">
            <button id="btnCopiar" class="btn btn-prim">
              <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke-linecap="round"/></svg>
              Copiar enlace
            </button>
            <img id="qrInv" class="qr" alt="Código QR de invitación">
          </div>
        </div>

        <ul id="listaInvitaciones" class="lista"></ul>
      </section>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/album/ajustes.js"></script>
</body>
</html>
